name: One-time GHCR image backfill
# Retry with the corrected installable Longbridge version.
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-time-ghcr-backfill.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ghcr.io/tylonhh/daily_stock_analysis:latest
            ghcr.io/tylonhh/daily_stock_analysis:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/TylonHH/daily_stock_analysis
